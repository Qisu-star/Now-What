name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 shared
        run: pnpm --filter @nowwhat/shared build

      - name: 类型检查
        run: pnpm -r typecheck

      - name: 单元与集成测试
        run: pnpm -r test

      - name: 构建前端
        run: pnpm --filter @nowwhat/web build

      - name: 校验 OpenAPI 契约
        run: |
          pnpm --filter @nowwhat/api openapi
          git diff --exit-code apps/api/openapi.json

  e2e:
    name: 端到端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建产物
        run: pnpm build

      - name: 安装浏览器
        run: pnpm exec playwright install --with-deps chromium

      - name: 运行 E2E
        run: pnpm test:e2e

      - name: 失败时上传报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
